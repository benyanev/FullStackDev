# nginx — serves the built React app and forwards API/media requests to Flask.
# The browser only ever talks to nginx (one origin), so no CORS is needed.

server {
    listen 80;
    server_name _;

    # Allow video uploads (backend limit is 50 MB)
    client_max_body_size 51m;

    # ---- Security headers ----
    server_tokens off;                                  # don't advertise the nginx version
    add_header X-Frame-Options DENY always;             # no framing → no clickjacking
    add_header X-Content-Type-Options nosniff always;   # files are only what their type says
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Only load code/media from this site. 'unsafe-inline' styles: MUI injects
    # <style> tags. blob: = previews of files chosen for upload.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Look up the "backend" container through Docker's DNS on every request
    # (cached 10 s). Without this nginx resolves the name only once at startup,
    # so after the backend is restarted/rebuilt (new IP) every request gets 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:5000;

    # API → Flask (Gunicorn) in the "backend" container
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;   # AI requests can take a while
    }

    # Uploaded images/videos (stored in the backend's uploads volume).
    # Streamed straight to the browser instead of buffered to temp files.
    location /static/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # React Router: any other path (/users, /profile/5, ...) loads index.html
    location / {
        try_files $uri /index.html;
    }
}
